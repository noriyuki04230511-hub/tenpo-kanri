<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>店舗管理システム（試作・見本店）</title>
<meta name="robots" content="noindex,nofollow">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@300;400;500&family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  /* 配置の考え方: 上に白い題名の帯、その下に青い状況の帯、中央は白い枠の部品を広い余白で並べ、下に青い操作の帯と切り替えのタブ。
     線は1px、角は小さく、影は使わない。関連するものは近く、別のものは離す。進む操作だけを珊瑚色にする */
  color-scheme: light;
  --bg:#f3f5f7; --surface:#ffffff; --tint:#eaf2fb;
  --ink:#22303d; --ink2:#5b6976; --line:#d4dae1; --off:#e3e7eb;
  --blue:#2a74c7; --blue-deep:#1f5ea6;
  --accent:#dd4468;
  --ok:#1b7d52; --ok-pale:#e6f4ee;
  --amber:#a66200; --amber-pale:#fdf1dc;
  --red:#cf3a3a; --red-pale:#fdeaea;
  --ui:"Noto Sans JP","Hiragino Sans","Yu Gothic UI",sans-serif;
  --num:"Barlow","Noto Sans JP",sans-serif;
  --tabs:64px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{height:100%}
body{min-height:100%}
body{font-family:var(--ui);font-weight:400;background:var(--bg);color:var(--ink);line-height:1.6;font-size:16px;-webkit-text-size-adjust:100%;padding-bottom:var(--tabs)}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none;text-align:inherit}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-weight:500;line-height:1.3;text-wrap:balance}
svg{flex:none}
.num{font-family:var(--num);font-variant-numeric:tabular-nums}

.topbar{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line);display:grid;grid-template-columns:1fr auto 1fr;align-items:center;min-height:56px;padding:0 20px;gap:12px}
.topbar h1{font-size:21px;font-weight:400;letter-spacing:.08em}
.topbar .l{justify-self:start} .topbar .r{justify-self:end;display:flex;gap:16px;align-items:center}
.link{color:var(--blue);font-size:15px;min-height:44px;display:inline-flex;align-items:center;gap:4px}
.topbar .clock{color:var(--blue);font-size:16px}
.demo{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:flex-end;padding:6px 20px;background:#fff9e6;border-bottom:1px solid #ecd79a;font-size:12.5px;color:#6b5200}
.demo button{min-height:32px;padding:2px 12px;border:1px solid #c9a53a;border-radius:4px;background:#fff;font-size:13px}

.band{background:var(--blue);color:#fff;display:flex;flex-wrap:wrap;align-items:center;gap:16px 24px;padding:16px 24px}
.b-box{border:1px solid rgba(255,255,255,.75);border-radius:4px;min-width:92px;text-align:center}
.b-box span{display:block;font-size:12.5px;padding:3px 10px;border-bottom:1px solid rgba(255,255,255,.75)}
.b-box b{display:block;font-family:var(--num);font-weight:400;font-size:26px;line-height:1.5;padding:0 10px}
.b-main small{display:block;font-size:13px;opacity:.92}
.b-main strong{font-size:24px;font-weight:400;letter-spacing:.06em}
.b-right{margin-left:auto;display:flex;align-items:center;gap:20px}
.b-stat{text-align:right;line-height:1.2}
.b-stat b{font-family:var(--num);font-weight:300;font-size:40px}
.b-stat small{display:block;font-size:12.5px;opacity:.92}
.b-alert{position:relative;border:1px solid rgba(255,255,255,.75);border-radius:4px;min-height:48px;padding:8px 16px;font-size:14px;display:inline-flex;align-items:center}
.b-alert i{position:absolute;top:-12px;right:-12px;min-width:26px;height:26px;border-radius:13px;background:var(--accent);font-style:normal;font-family:var(--num);font-weight:500;font-size:15px;display:grid;place-items:center;padding:0 6px}
.crumbs{display:flex;flex-wrap:wrap;gap:4px 10px;padding:12px 24px 0;font-size:13px;color:var(--ink2)}
.crumbs b{color:var(--blue);font-weight:700}

main{padding:24px 24px 40px;display:flex;flex-direction:column;gap:32px;max-width:1200px;width:100%;margin:0 auto}
.sec{display:flex;flex-direction:column;gap:12px}
.sec>h2,.box>h2,.sec>.row>h2{font-size:15px;font-weight:700;letter-spacing:.06em;color:var(--ink)}
.sub{color:var(--ink2);font-size:13.5px}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.between{justify-content:space-between}
.grid{display:grid;gap:12px}
.g3{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.box{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:20px 24px;display:flex;flex-direction:column;gap:16px}

.btn{min-height:52px;padding:10px 24px;border-radius:4px;font-size:16px;font-weight:500;letter-spacing:.04em;background:var(--accent);color:#fff;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center}
.btn.blue{background:var(--blue)}
.btn.line{background:var(--surface);color:var(--blue);border:1px solid var(--blue)}
.btn.onblue{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.8)}
.btn.s{min-height:44px;padding:6px 16px;font-size:15px}
.btn[disabled]{background:var(--off);color:#8b96a1;border-color:var(--off);cursor:not-allowed}
.btn.onblue[disabled]{background:transparent;color:rgba(255,255,255,.45);border:1px dashed rgba(255,255,255,.45)}
.action .why{flex:1 1 220px;min-width:0;font-size:13px;line-height:1.45;color:#fff}

.person{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:12px 14px;display:flex;align-items:center;gap:12px;position:relative;min-height:72px}
.ava{width:42px;height:42px;border-radius:50%;border:1px solid var(--blue);color:var(--blue);display:grid;place-items:center;font-size:17px}
.person.off .ava{border-color:var(--line);color:var(--ink2)}
.person .nm{font-size:17px;font-weight:500;line-height:1.3}
.person .st{font-size:12.5px;color:var(--ink2);white-space:nowrap}
.person .btn{margin-left:auto}
.person .un{margin-left:auto;font-size:13px;color:var(--ink2);text-decoration:underline;text-underline-offset:3px;min-height:44px;padding:0 4px;white-space:nowrap}
.grid.staffg{grid-template-columns:repeat(auto-fill,minmax(264px,1fr))}
.person .pc{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end}
.person .pc .un{min-height:34px}
.link.del{font-size:13.5px;color:var(--ink2);text-decoration:underline;text-underline-offset:3px}
.ovl{position:fixed;inset:0;z-index:300;background:rgba(20,32,45,.5);display:flex;align-items:center;justify-content:center;padding:20px}
.dlg{background:var(--surface);border-radius:6px;width:100%;max-width:460px;padding:24px;display:flex;flex-direction:column;gap:12px}
.dlg h2{font-size:18px;font-weight:700;line-height:1.5}
.dlg .gone{font-size:17px;font-weight:700;color:var(--red);background:var(--red-pale);border:1px solid var(--red);border-radius:4px;padding:10px 12px}
.dlg .acts{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:6px}
.dlg .acts .btn{min-height:50px}
.btn.danger{background:var(--red);border-color:var(--red);color:#fff}
.badge{position:absolute;top:-10px;left:36px;background:var(--accent);color:#fff;font-size:11.5px;font-weight:500;border-radius:12px;padding:1px 9px}
.person.add{justify-content:center;color:var(--blue);border-style:dashed;gap:8px;width:100%}

.tile{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:6px;overflow:hidden;display:flex;flex-direction:column;min-height:190px}
.tile .hd{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 14px;background:var(--off);color:var(--ink);font-size:13.5px}
.tile .hd b{font-family:var(--num);font-weight:400;font-size:22px;margin-left:4px}
.tile .bd{padding:16px 14px;display:flex;flex-direction:column;gap:12px;flex:1}
.tile .mid{display:flex;align-items:center;gap:12px}
.tile .big{font-family:var(--num);font-weight:300;font-size:56px;line-height:.9;color:var(--blue)}
.tile .big small{font-family:var(--ui);font-size:14px;font-weight:400;color:var(--ink2);margin-left:4px}
.tile .cap{font-size:12.5px;color:var(--ink2)}
.tile .who{font-size:13.5px;color:var(--ink);margin-top:auto;line-height:1.5}
.tile .who span{color:var(--ink2)}
.tile.recv .hd{background:var(--tint);color:var(--blue-deep)}
.tile.serve .hd{background:var(--blue);color:#fff}
.tile.proc .hd{background:var(--amber);color:#fff} .tile.proc .big,.tile.proc .ring{color:var(--amber)}
.tile.won .hd{background:var(--ok);color:#fff} .tile.won .big{color:var(--ok)}
.tile.crit{border-color:var(--red)} .tile.crit .hd{background:var(--red);color:#fff} .tile.crit .big,.tile.crit .ring{color:var(--red)}
.tile.empty .bd{justify-content:center;align-items:center;color:var(--blue);font-size:15px}
.tile.rsv .hd{background:var(--blue-deep);color:#fff}
.tile.rsv .big{font-size:46px;line-height:1}
.tile.addt{align-items:center;justify-content:center;border-style:dashed;color:var(--blue);gap:8px;font-size:15px;background:transparent}
button.tile:hover,.pickc:hover{border-color:var(--blue)}
.ring{transform:rotate(-90deg)}
.ring .tr{stroke:currentColor;opacity:.18;fill:none}
.ring .pr{stroke:currentColor;fill:none}

.pickc{width:100%;min-height:92px;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:16px 18px;display:flex;align-items:center;gap:14px}
.pickc b{display:block;font-size:18px;font-weight:500;line-height:1.4}
.pickc .d{font-size:13.5px;color:var(--blue)}
.pickc .kind{margin-left:auto;font-size:12px;border:1px solid var(--line);border-radius:3px;padding:1px 8px;color:var(--ink2);white-space:nowrap}
.pickc.keep{border:2px solid var(--blue);background:var(--tint)}

.memo{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:15px}
.memo dt{color:var(--ink2);font-size:13.5px} .memo dd{font-weight:500}
.sug{border:1px solid #bcd5ee;background:var(--tint);border-radius:4px;padding:12px 14px}
.sug b{display:block;font-size:16.5px;font-weight:500;color:var(--blue-deep)}
.cl-row{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line)}
.cl-row:first-child{border-top:1px solid var(--line)}
.cl-name{flex:1 1 190px;font-size:17px}
.seg{display:flex;gap:8px}
.tg{min-width:116px;min-height:46px;border:1px solid var(--blue);border-radius:4px;background:var(--surface);color:var(--blue);font-size:15px;padding:4px 12px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.tg i{width:18px;height:18px;border-radius:50%;border:1px solid currentColor;display:grid;place-items:center;font-style:normal}
.tg i svg{opacity:0}
.tg[aria-pressed="true"]{background:var(--blue);color:#fff}
.tg[aria-pressed="true"] i svg{opacity:1}
.tg.b{border-color:var(--ok);color:var(--ok)}
.tg.b[aria-pressed="true"]{background:var(--ok);color:#fff}
.tg.auto{min-width:0}
.qty{flex:1 1 100%;display:flex;align-items:center;justify-content:flex-end;gap:10px;font-size:14px;color:var(--ink2)}
.qty button{width:46px;height:46px;border:1px solid var(--ok);border-radius:4px;color:var(--ok);font-size:24px;line-height:1;background:var(--surface)}
.qty button[disabled]{border-color:var(--off);color:#b3bcc5;cursor:not-allowed}
.qty b{font-family:var(--num);font-weight:400;font-size:26px;color:var(--ok);min-width:56px;text-align:center}
.qty b small{font-family:var(--ui);font-size:13px;margin-left:2px}

#act{position:sticky;bottom:var(--tabs);z-index:4}
.action{background:var(--blue);color:#fff;display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;padding:14px 24px}
.action .sum{display:flex;gap:20px;align-items:baseline;font-size:14px;margin-right:auto}
.action .sum b{font-family:var(--num);font-weight:300;font-size:34px;margin-left:6px}

.timer{display:flex;align-items:center;gap:16px;color:var(--blue)}
.timer .big{font-family:var(--num);font-weight:300;font-size:54px;line-height:1}
.timer .u{font-size:14px;color:var(--ink2);margin-left:4px}
.timer.over{color:var(--red)} .timer.done{color:var(--ok)}

.alert{display:flex;gap:14px;align-items:center;border:1px solid var(--red);background:var(--red-pale);border-radius:4px;padding:12px 16px}
.alert.w{border-color:#d9a650;background:var(--amber-pale)}
.alert .ic{width:34px;height:34px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center;font-family:var(--num);font-weight:500;font-size:19px;flex:none}
.alert.w .ic{background:var(--amber)}
.alert b{display:block;font-size:16.5px;font-weight:500}
.alert span{font-size:13.5px;color:var(--ink2)}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:4px}
.kpi{padding:16px 18px;border-left:1px solid var(--line)} .kpi:first-child{border-left:none}
.kpi .v{font-family:var(--num);font-weight:300;font-size:54px;line-height:1;color:var(--blue)}
.kpi .l{font-size:13px;color:var(--ink2);margin-top:6px}
table{width:100%;border-collapse:collapse}
th,td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:left;font-size:15px}
th{font-size:12.5px;color:var(--ink2);font-weight:400}
td.n{text-align:right;font-family:var(--num);font-size:19px;color:var(--blue)} th.n{text-align:right}
.scroll{overflow-x:auto}
.pb{display:grid;grid-template-columns:minmax(120px,200px) 1fr auto;gap:10px 14px;align-items:center;font-size:14px}
.pb .bars{display:flex;flex-direction:column;gap:3px}
.pb .b1,.pb .b2{height:6px;border-radius:3px;min-width:2px}
.pb .b1{background:var(--blue)} .pb .b2{background:var(--ok)}
.pb .v{font-family:var(--num);font-size:15px;color:var(--ink2)}
.legend{display:flex;gap:16px;font-size:12.5px;color:var(--ink2)}
.legend i{display:inline-block;width:14px;height:6px;border-radius:3px;margin-right:6px;vertical-align:middle}
.feed{display:flex;gap:16px;align-items:baseline;padding:10px 0;border-bottom:1px solid var(--line)}
.feed:first-child{border-top:1px solid var(--line)}
.feed .t{font-family:var(--num);font-size:17px;color:var(--blue)}
.pill{display:inline-flex;align-items:baseline;gap:8px;border:1px solid var(--line);border-radius:4px;padding:6px 14px;font-size:14px;background:var(--surface)}
.pill b{font-family:var(--num);font-weight:400;font-size:22px;color:var(--blue)}

.tabs{position:fixed;left:0;right:0;bottom:0;height:var(--tabs);z-index:5;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;gap:8px}
.tab{flex:0 1 200px;display:flex;align-items:center;justify-content:center;gap:10px;font-size:14.5px;color:var(--ink2)}
.tab[aria-pressed="true"]{color:var(--blue);font-weight:500;box-shadow:inset 0 3px 0 var(--blue)}

.rv{display:grid;grid-template-columns:76px 1fr auto;gap:4px 16px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.rv:first-child{border-top:1px solid var(--line)}
.rv .t{font-family:var(--num);font-weight:300;font-size:30px;line-height:1;color:var(--blue)}
.rv .t small{display:block;font-family:var(--ui);font-size:12px;font-weight:400;color:var(--ink2);margin-top:4px}
.rv .w b{display:block;font-size:16.5px;font-weight:500}
.rv .w span{font-size:13px;color:var(--ink2)}
.rv .x{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:flex-end}
.chip{font-size:12.5px;border:1px solid var(--line);border-radius:3px;padding:2px 10px;color:var(--ink2);white-space:nowrap;background:var(--surface)}
.chip.seated{border-color:var(--blue-deep);color:var(--blue-deep);background:var(--tint)}
.chip.arrived{border-color:var(--blue);color:#fff;background:var(--blue)}
.chip.done{border-color:var(--ok);color:var(--ok)}
.chip.noshow{border-color:var(--red);color:var(--red)}
.err{color:var(--red);font-size:14px}
input[type=date],input[type=time]{font:inherit;min-height:50px;border:1px solid var(--line);border-radius:4px;padding:8px 14px;background:#fff;color:var(--ink);width:100%}
body.cust-mode{background:var(--surface);padding-bottom:0}
body.cust-mode .tabs,body.start-mode .tabs,body.start-mode .demo{display:none}
.demo a{min-height:32px;padding:4px 12px;border:1px solid #c9a53a;border-radius:4px;background:#fff;font-size:13px;color:inherit;text-decoration:none;display:inline-flex;align-items:center}
input[type=password]{font:inherit;min-height:50px;border:1px solid var(--line);border-radius:4px;padding:8px 14px;background:#fff;color:var(--ink);width:100%}
body.cust-mode main{max-width:920px;gap:28px;padding-top:28px}
.paper{display:flex;flex-direction:column;gap:28px;font-weight:500}
.paper .lead{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:15px;color:var(--ink2);font-weight:400}
.paper h2{font-size:clamp(27px,5vw,38px);font-weight:500;line-height:1.4;letter-spacing:.04em}
.prog{height:4px;background:var(--off)} .prog i{display:block;height:100%;background:var(--blue)}
.opts{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(214px,1fr))}
.opt{min-height:84px;border:1px solid var(--blue);border-radius:6px;background:var(--surface);color:var(--blue-deep);font-size:23px;font-weight:500;padding:12px 16px;display:flex;align-items:center;justify-content:center;text-align:center}
.opt[aria-pressed="true"]{background:var(--blue);color:#fff}
.five{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.five .opt{font-family:var(--num);font-weight:400;font-size:34px;min-height:76px}
.paper .btn{min-height:64px;font-size:20px;padding:12px 32px}

input[type=text],select{font:inherit;min-height:50px;border:1px solid var(--line);border-radius:4px;padding:8px 14px;background:#fff;color:var(--ink);width:100%}
label{font-size:14px;color:var(--ink2);display:flex;flex-direction:column;gap:6px}

@media (max-width:760px){
  .topbar{padding:0 12px;grid-template-columns:auto 1fr auto} .topbar h1{font-size:18px;text-align:center}
  .topbar .clock{display:none}
  .band{padding:14px 16px;gap:12px 16px} .b-main strong{font-size:19px} .b-stat b{font-size:32px}
  .crumbs{padding:10px 16px 0}
  main{padding:20px 16px 32px;gap:28px}
  .box{padding:16px}
  .seg{width:100%} .seg .tg{flex:1;min-width:0}
  .action{padding:10px 16px;gap:8px 10px} .action .btn{flex:1 1 40%;min-height:46px;padding:6px 12px} .action .btn:last-child{flex:1 1 100%;min-height:50px} .action .sum{width:100%} .action .why{flex:1 1 100%;font-size:13.5px} .action .sum b{font-size:26px}
  .paper .btn{flex:1}
  .opts{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px} .opt{font-size:19px;min-height:72px;padding:10px 8px}
  .kpi .v{font-size:40px} .kpi{padding:12px}
  .pb{grid-template-columns:1fr auto} .pb>span:nth-child(3n+1){grid-column:1/-1;margin-bottom:-6px}
  .tab{flex:1;flex-direction:column;gap:2px;font-size:12.5px}
  .rv{grid-template-columns:64px 1fr} .rv .x{grid-column:1/-1;justify-content:flex-start} .rv .t{font-size:26px}
}
@media (prefers-reduced-motion:no-preference){
  .btn,.tg,.opt,.pickc,.tile,.tab{transition:background .12s ease,border-color .12s ease,color .12s ease}
  .ring .pr{transition:stroke-dashoffset .5s ease}
}
</style>
</head>
<body>
<header class="topbar"><div class="l" id="tb-l"></div><h1 id="tb-t"></h1><div class="r" id="tb-r"></div></header>
<div class="demo"><span id="net"></span><span id="who"></span><span id="bar-btns" style="display:inline-flex;gap:8px;flex-wrap:wrap"></span></div>
<div id="band"></div>
<main id="app"></main>
<div id="act"></div>
<div id="modal"></div>
<nav class="tabs" aria-label="画面の切り替え">

<script>
'use strict';
const TYPES=[
 {k:'in_guide',n:'インバウンド操作説明（サポート会員ヒアリングなし）',d:'サポート会員の操作説明。ヒアリングなしで始められます',g:'来店',inbound:true,skip:true},
 {k:'in_guide_h',n:'インバウンド操作説明（ヒアリングあり）',d:'操作説明のご来店で、ヒアリングも行う場合',g:'来店',inbound:true},
 {k:'in_meo',n:'インバウンド MEO広告',d:'地図の検索や広告を見て来店した、新しいお客様',g:'来店',inbound:true},
 {k:'in_req',n:'インバウンド（要件あり）',d:'プラン変更・料金収納など、用件が決まっている来店',g:'来店',inbound:true},
 {k:'in',n:'インバウンド',d:'上の4つに当てはまらない来店',g:'来店',inbound:true},
 {k:'out',n:'アウトバウンド',d:'店の外での声掛けから着席',g:'声掛け'},
 {k:'fix',n:'什器付き',d:'什器での声掛けから着席',g:'声掛け'},
 {k:'event',n:'イベント',d:'イベント会場での接客',g:'声掛け'},
 {k:'revisit',n:'見込再来店',d:'以前に見込みだったお客様の再来店',g:'再来店'}];
const QS=[
 {k:'age',s:'年代',q:'年代を教えてください',o:['10代','20代','30代','40代','50代','60〜64歳','65〜69歳','70〜74歳','75〜79歳','80〜84歳','85歳以上']},
 {k:'purpose',s:'ご用件',q:'今日のご用件は何ですか',o:['機種変更・乗り換えの相談','料金の見直し','使い方を知りたい','修理・故障','その他']},
 {k:'carrier',s:'携帯',q:'今お使いの携帯会社はどちらですか',o:['ソフトバンク','ワイモバイル','ドコモ','au','UQモバイル','楽天モバイル','その他・分からない']},
 {k:'lines',s:'ご家族',q:'ご家族で何台お使いですか',o:['1台','2台','3台','4台以上']},
 {k:'net',s:'自宅のネット',q:'ご自宅のインターネットはどうされていますか',o:['光回線がある','置くだけのWi-Fiがある','ない','分からない']}];
const PRODS=[
 {k:'carrier',n:'携帯（SB／YM／UQ／ERA）'},{k:'net',n:'自宅のインターネット'},{k:'support',n:'店頭サポート（保証込み）'},
 {k:'security',n:'セキュリティ・広告ブロック'},{k:'used',n:'中古・新古スマホ'},{k:'coat',n:'コーティング・カバー'},
 {k:'energy',n:'電気・ガス'},{k:'water',n:'ウォーターサーバー'},{k:'repair',n:'スマホ・PC修理'}];
const ACTS=[{k:'est',n:'見積書お渡し'},{k:'card',n:'名刺お渡し'},{k:'pros',n:'見込み登録'}];
const EXTRA=['景品プレゼント','アンケート'];
const COMPANIES=['見本A社','見本B社','見本C社','その他（会社名を入力）'];
const SENIOR=['65〜69歳','70〜74歳','75〜79歳','80〜84歳','85歳以上'];
const STEPS=['受付','来店区分','ヒアリング','接客','手続き','アンケート'];
const CUST=['cust','custdone','survey','thanks'];
const RSCREEN=['resv','resvnew'];
const RST={booked:'予約中',seated:'席を用意済み',arrived:'来店・接客中',done:'完了',cancel:'取消',noshow:'来店なし'};
const LEAD=15; /* 予約の何分前に席を用意して知らせるか */
const CHK='<i><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12.5l5 5L20 6.5"/></svg></i>';
const CHEV='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>';
const BACK='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>';
const PLUS='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9.5"/><path d="M12 7.5v9M7.5 12h9"/></svg>';

let S, skew=0;
const M=60000;
const now=()=>Date.now()+skew;
const mins=t=>Math.max(0,Math.floor((now()-t)/M));
const hm=t=>{const d=new Date(t);return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function init(){
  S={role:'staff',screen:'home',tid:null,step:0,draft:null,surveys:0,surveyAvg:null,hist:[],recvId:null,changing:false,afterPick:false,
   staff:[],tables:[],closed:[],feed:[],resv:[],shop:{name:''},ready:false,
   help:{kind:'イベント応援',co:COMPANIES[0],name:''},rf:null,rfErr:''};
}
const RV=id=>S.resv.find(r=>r.id===id);
const ymd=t=>{const d=new Date(t);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const dayLabel=t=>{const a=ymd(t),b=ymd(now());if(a===b)return '本日';const d=new Date(t);return (d.getMonth()+1)+'/'+d.getDate()};
/* 予約の15分前になったら、卓を1つ自動で用意する */
function syncResv(){
  S.resv.forEach(r=>{ if(r.st==='booked'&&now()>=r.at-LEAD*M){
    const id=Math.max(...S.tables.map(t=>t.id))+1;
    S.tables.push({id,name:'卓'+id,v:null,auto:true,rid:r.id}); r.st='seated'; r.tid=id; }});
}
function dropAutoTable(r){ const t=S.tables.find(x=>x.id===r.tid); if(t&&t.auto&&!t.v) S.tables=S.tables.filter(x=>x!==t); r.tid=null; }
const rwait=r=>Math.ceil((r.at-now())/M);
const rwhen=r=>{const d=rwait(r);return d>0?`あと${d}分`:d===0?'予約の時刻です':`予約時刻を${-d}分過ぎています`};
const T=()=>S.tables.find(x=>x.id===S.tid);
const V=()=>T()&&T().v;
const staffName=id=>{const s=S.staff.find(x=>x.id===id);return s?s.name:'—'};
const typeOf=k=>TYPES.find(x=>x.k===k);
const onDuty=()=>S.staff.filter(s=>s.inAt&&!s.outAt);
const seg=v=>v.segs[v.segs.length-1];
const qn=(g,k)=>(g.q&&+g.q[k])||1; /* 獲得の件数。入力がなければ1 */
const wq=g=>g.w.reduce((a,k)=>a+qn(g,k),0);
/* 押し間違いの取り消し。消す前に必ず「このデータは残りません」を出す */
let MD=null, MV=0;
const UERR={in_use:'すでに接客の記録に使われているため、取り消せません。',not_found:'すでに取り消されています。',last_table:'卓は1つ以上必要です。最後の1つは消せません。',auto_table:'予約のために用意された卓です。予約の画面で操作してください。',bad_request:'取り消せませんでした。'};
const inUse=id=>S.tables.some(t=>t.v&&(t.v.recv===id||t.v.segs.some(g=>g.sid===id)));
function modalHtml(){
  if(!MD) return '';
  if(MD.err) return `<div class="ovl"><div class="dlg" role="alertdialog" aria-modal="true" aria-labelledby="dlg-t" aria-describedby="dlg-err"><h2 id="dlg-t">${esc(MD.title||'取り消せませんでした')}</h2><p id="dlg-err">${esc(MD.err)}</p><div class="acts"><button class="btn line" id="dlg-no" data-a="mno">閉じる</button></div></div></div>`;
  const tt={clock_in:[`${MD.n}さんの出勤を取り消しますか`,'出勤を取り消す'],clock_out:[`${MD.n}さんの退勤を取り消しますか`,'退勤を取り消す'],helper:[`応援スタッフ「${MD.n}」さんの追加を取り消しますか`,'追加を取り消す'],table:[`${MD.n}を消しますか`,'卓を消す'],reservation:[`予約（${MD.n}）を消しますか`,'予約を消す'],void:['この受付を取り消しますか','受付を取り消す']}[MD.k]||['取り消しますか','取り消す'];
  const more=MD.k==='reservation'?'<br>お客様のご都合によるキャンセルは、「取り消す」を使ってください（キャンセルとして記録に残ります）。':MD.k==='void'?'<br>来店区分を選び直す場合も、いまの記録は消え、選び直したところから新しく始まります。':'';
  return `<div class="ovl"><div class="dlg" role="alertdialog" aria-modal="true" aria-labelledby="dlg-t" aria-describedby="dlg-gone"><h2 id="dlg-t">${esc(tt[0])}</h2>
    <p class="gone" id="dlg-gone">このデータは残りません。</p>
    <p class="sub" id="dlg-sub">${MD.k==='clock_out'?'退勤の時刻を消し、出勤中に戻します。':'記録を消し、集計にも入りません。'}取り消したことだけが、操作の履歴に残ります。${more}</p>
    <div class="acts"><button class="btn line" id="dlg-no" data-a="mno" ${MD.busy?'disabled':''}>やめる</button><button class="btn danger" id="dlg-yes" data-a="myes" ${MD.busy?'disabled':''}>${MD.busy?'取り消しています':esc(tt[1])}</button></div></div></div>`;
}
function renderModal(){const c=document.getElementById('modal'); if(c.dataset.v===String(MV)) return; c.dataset.v=String(MV); c.innerHTML=modalHtml(); const b=document.getElementById('dlg-no'); if(b) b.focus();}
async function undoCall(m){
  for(let i=0;i<25&&(Q.length||busy);i++) await sleep(200);
  try{
    if(Q.length||busy) throw new Error('not sent yet');
    const f=await call('app_undo',{p_device:DEV.device,p_secret:DEV.secret,p_kind:m.k,p_id:m.id});
    if(f&&f.error) MD={...m,busy:false,err:UERR[f.error]||UERR.bad_request}; else {applyFloor(f); MD=null;}
  }catch(e){MD={...m,busy:false,err:'通信できませんでした。つながってから、もう一度お試しください。'};}
  MV++; render();
}
const anyWon=v=>v.segs.some(x=>x.w.length>0); /* 1つでも獲得があれば「成約なしで終了」は不可（担当変更の前の分も含む） */
const prod=k=>PRODS.find(p=>p.k===k).n;
const tnum=t=>t.name.replace('卓','');

function alerts(){
  const a=[];
  if(S.shop&&S.shop.opens&&now()>=S.shop.opens+5*M&&!S.staff.some(s=>s.inAt)) a.push({lv:'crit',t:'まだ誰も出勤ボタンを押していません',d:`開店時刻 ${hm(S.shop.opens)} を${mins(S.shop.opens)}分過ぎています。出勤したスタッフが出勤ボタンを押すと消えます。`});
  S.resv.forEach(r=>{ if(r.st!=='seated') return; const d=rwait(r), tb=S.tables.find(x=>x.id===r.tid), who=r.staff?staffName(r.staff)+'さん':'未定';
    const tail=`${tb?tb.name+'を用意しました。':''}担当：${who}。受付を始めると消えます。`;
    if(d>0) a.push({lv:'warn',tid:r.tid,t:`予約の${LEAD}分前です：${hm(r.at)}　${r.purpose}`,d:`あと${d}分。${tail}`});
    else if(d>-15) a.push({lv:'warn',tid:r.tid,t:`予約の時刻です：${hm(r.at)}　${r.purpose}`,d:tail});
    else a.push({lv:'crit',tid:r.tid,t:`予約時刻を${-d}分過ぎています：${hm(r.at)}　${r.purpose}`,d:`担当：${who}。来店されない場合は、予約の画面で「来店なし」にすると消えます。`});
  });
  S.tables.forEach(t=>{const v=t.v;if(!v)return;
    [['setup','顧客登録'],['move','データ移行']].forEach(([k,n])=>{const x=v[k];
      if(x.s&&!x.e){const m=mins(x.s); if(m>=30){const nth=Math.floor((m-30)/15)+1;
        a.push({lv:m>=45?'crit':'warn',tid:t.id,t:`${t.name}　${n}に${m}分経過`,d:`${nth}回目のお知らせ（30分から15分ごと）。完了ボタンが押されると消えます。担当：${staffName(seg(v).sid)}さん`});}}});
  });
  return a;
}
function tableState(t){
  const v=t.v; if(!v) return {k:'empty',l:'空き'};
  if(v.phase==='hearing') return {k:'recv',l:'ヒアリング中'};
  if(v.phase==='ready') return {k:'recv',l:'接客開始待ち'};
  if(v.phase==='serving') return {k:'serve',l:'接客中'};
  if(v.setup.s&&!v.setup.e) return {k:'proc',l:'顧客登録中',since:v.setup.s,cap:'顧客登録の経過'};
  if(v.move.s&&!v.move.e) return {k:'proc',l:'データ移行中',since:v.move.s,cap:'データ移行の経過'};
  return {k:'won',l:'成約・手続き'};
}
function suggest(h){
  if(!h) return null; const out=[];
  const many=['2台','3台','4台以上'].includes(h.lines);
  if(many||['機種変更・乗り換えの相談','料金の見直し'].includes(h.purpose))
    out.push({k:'carrier',r:many?`ご家族で${h.lines}お使いです。まとめて見直すと月々の料金が下がるかを確認できます。`:'ご用件が料金・機種のご相談です。今より安くなる場合だけご案内します。'});
  if(['ない','置くだけのWi-Fiがある'].includes(h.net)) out.push({k:'net',r:'ご自宅に光回線が無いとお答えです。スマホとのセット割引の対象かを確認できます。'});
  if(SENIOR.includes(h.age)||h.purpose==='使い方を知りたい') out.push({k:'support',r:'操作のご相談と、故障したときの保証をまとめて受けられます。'});
  if(h.purpose==='修理・故障'){out.push({k:'repair',r:'ご用件が修理・故障です。まず修理の見積りをお出しします。'});out.push({k:'used',r:'修理より買い替えのほうが安い場合の選択肢です。'});}
  return out;
}
function ring(m,limit,size){
  const r=size/2-3, c=2*Math.PI*r, p=Math.min(1,m/limit);
  return `<svg class="ring" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-hidden="true"><circle class="tr" cx="${size/2}" cy="${size/2}" r="${r}" stroke-width="3"/><circle class="pr" cx="${size/2}" cy="${size/2}" r="${r}" stroke-width="3" stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${(c*(1-p)).toFixed(1)}"/></svg>`;
}
function tile(t,mini){
  const st=tableState(t), v=t.v, al=alerts().filter(x=>x.tid===t.id);
  const r=!v&&t.auto?RV(t.rid):null;
  const cls=r?(al.some(a=>a.lv==='crit')?'crit':'rsv'):!v?'empty':al.some(a=>a.lv==='crit')?'crit':st.k;
  const inner=r?`<span class="hd"><span>卓<b>${esc(tnum(t))}</b></span><span>予約席</span></span>
    <span class="bd"><span><span class="big">${hm(r.at)}</span><br><span class="cap">${rwhen(r)}</span></span>
      <span class="who">${esc(r.purpose)}<br><span>担当</span> ${r.staff?esc(staffName(r.staff)):'未定'}　<span>予約番号</span> ${esc(r.no)}</span>
      ${mini?'':'<span style="color:var(--blue);font-size:14px">来店されたらタップして受付</span>'}</span>`:`<span class="hd"><span>卓<b>${esc(tnum(t))}</b></span><span>${st.l}</span></span>
    <span class="bd">${v?`<span class="mid">${st.since?ring(mins(st.since),30,54):''}<span><span class="big">${st.since?mins(st.since):mins(v.at)}<small>分</small></span><br><span class="cap">${st.cap||'来店から'}</span></span></span>
      <span class="who">${esc(typeOf(v.type).n)}<br><span>受付</span> ${esc(staffName(v.recv))}　<span>担当</span> ${v.segs.length?esc(staffName(seg(v).sid)):'未定'}</span>`
    :`<span>${mini?'空いています':'受付を始める'}</span>`}</span>`;
  return mini?`<div class="tile ${cls}">${inner}</div>`:`<button class="tile ${cls}" id="table-${t.id}" data-a="table" data-id="${t.id}">${inner}</button>`;
}
function stepIndex(){
  const sc=S.screen;
  if(sc==='recv') return 0; if(sc==='type') return 1;
  if(['mode','cust','custdone','staffhear'].includes(sc)) return 2;
  if(sc==='pick') return S.afterPick?4:3; if(sc==='serve') return 3;
  if(sc==='after') return 4; return 5;
}
const crumbs=()=>{const i=stepIndex();return `<div class="crumbs" aria-label="進み具合">${STEPS.map((s,n)=>(n===i?`<b>${s}</b>`:`<span>${s}</span>`)+(n<STEPS.length-1?'<span aria-hidden="true">›</span>':'')).join('')}</div>`};
function ctxBand(){
  const t=T(), v=t.v, rid=v?v.recv:S.recvId;
  const right=v?`<div class="b-right"><div class="b-stat"><b>${mins(v.at)}</b> 分<small>来店から</small></div></div>`:'';
  return `<div class="band"><div class="b-box"><span>卓</span><b>${esc(tnum(t))}</b></div>
    <div class="b-main"><small>受付 ${rid?esc(staffName(rid))+'さん':'未選択'}${v&&v.segs.length?'　担当 '+esc(staffName(seg(v).sid))+'さん':''}</small><strong>${v?esc(typeOf(v.type).n):'受付'}</strong></div>${right}</div>${crumbs()}`;
}
function resvNote(){
  const t=T(), rid=t.v?t.v.rid:t.rid, r=rid?RV(rid):null; if(!r) return '';
  return `<section class="box" style="gap:10px"><h2>ご予約のお客様</h2>
    <div class="row between"><span><span class="num" style="font-size:26px;color:var(--blue)">${hm(r.at)}</span>　${esc(r.purpose)}　<span class="sub">担当 ${r.staff?esc(staffName(r.staff))+'さん':'未定'}／予約番号 ${esc(r.no)}</span></span>
    ${t.v?'':`<button class="btn line s" id="resv-noshow" data-a="noshow" data-id="${r.id}">来店なしにする</button>`}</div></section>`;
}
function checklist(v,sg,after){
  const list=PRODS.filter(p=>!(after&&p.k==='carrier'));
  return `<div>${list.map(p=>`<div class="cl-row"><div class="cl-name">${p.n}</div>
      <div class="seg"><button class="tg a" id="p-${p.k}" aria-pressed="${sg.p.includes(p.k)}" data-a="prop" data-v="${p.k}">${CHK}提案した</button>
      <button class="tg b" id="w-${p.k}" aria-pressed="${sg.w.includes(p.k)}" data-a="win" data-v="${p.k}">${CHK}獲得した</button></div>
      ${sg.w.includes(p.k)?`<div class="qty" id="q-${p.k}"><span>件数（1組で2件以上のときだけ増やす）</span><button id="qm-${p.k}" data-a="qty" data-v="${p.k}" data-d="-1" aria-label="${p.n}の件数を1減らす" ${qn(sg,p.k)<=1?'disabled':''}>−</button><b id="qv-${p.k}">${qn(sg,p.k)}<small>件</small></b><button id="qp-${p.k}" data-a="qty" data-v="${p.k}" data-d="1" aria-label="${p.n}の件数を1増やす" ${qn(sg,p.k)>=20?'disabled':''}>＋</button></div>`:''}</div>`).join('')}</div>
    <div class="sec" style="gap:10px"><h2>お渡し・見込み</h2>
    <div class="row">${ACTS.map(a=>`<button class="tg a auto" id="act-${a.k}" aria-pressed="${(sg.a||[]).includes(a.k)}" data-a="act" data-v="${a.k}">${CHK}${a.n}</button>`).join('')}</div></div>`;

function stats(){
  const all=[...S.closed,...S.tables.filter(t=>t.v&&t.v.segs.length).map(t=>t.v)];
  const visits=S.closed.length+S.tables.filter(t=>t.v).length;
  const prop=all.filter(v=>v.segs.some(s=>s.p.length)).length;
  const won=all.filter(v=>v.result==='won').length;
  const per=S.staff.map(s=>{const mine=all.filter(v=>v.segs.some(x=>x.sid===s.id));
    return {n:s.name,v:mine.length,p:mine.filter(v=>v.segs.some(x=>x.sid===s.id&&x.p.length)).length,w:mine.filter(v=>v.segs.some(x=>x.sid===s.id&&x.w.length)).length}});
  const pr=PRODS.map(p=>({n:p.n,p:all.reduce((a,v)=>a+v.segs.filter(x=>x.p.includes(p.k)).length,0),w:all.reduce((a,v)=>a+v.segs.reduce((b,x)=>b+(x.w.includes(p.k)?qn(x,p.k):0),0),0)}));
  const acts=ACTS.map(a=>({n:a.n,c:all.reduce((x,v)=>x+v.segs.filter(g=>(g.a||[]).includes(a.k)).length,0)}));
  return {visits,prop,won,per,pr,acts};
}

/* 下の鍵は「公開用の鍵」で、画面に置く前提のもの。これだけでは表を読めず、登録済みの端末として入口の関数を呼べるだけ */
const CFG={url:'https://egpibhkwemssnanalfoh.supabase.co/rest/v1',key:'sb_publishable_1WSi5i6QZa7AJz-KnNG_1A_-7WVhZfd'};
const VSYNC=['type','hear','qnext','shdone','pick','prop','win','qty','act','won','tstart','tend','movenone'];
let DEV=null, Q=[], busy=false, lastErr=false;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const uuid=()=>(crypto.randomUUID?crypto.randomUUID():'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const r=crypto.getRandomValues(new Uint8Array(1))[0]&15;return (c==='x'?r:(r&3|8)).toString(16)}));
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
function net(){const el=document.getElementById('net'); if(!el) return; el.textContent=!DEV?'':lastErr?'通信が切れています。つながり次第、自動で送ります':(busy||Q.length?'保存しています':'保存済み');}
async function call(fn,args){
  const r=await fetch(CFG.url+'/rpc/'+fn,{method:'POST',headers:{'Content-Type':'application/json',apikey:CFG.key},body:JSON.stringify(args)});
  if(!r.ok){const e=new Error('http '+r.status); e.status=r.status; e.body=await r.text().catch(()=>''); throw e;}
  return r.json();
}
/* 送る内容は順番に並べ、通信が切れても消さずに送り直す。同じ接客の内容は、まだ送っていない分を新しい内容で置き換える */
function rpcQ(fn,args,key){
  if(key){const i=Q.findIndex((q,n)=>q.key===key&&!(busy&&n===0)); if(i>=0){Q[i].args=args; store.set('tk_q',Q); return;}}
  Q.push({fn,args,key}); store.set('tk_q',Q); pump();
}
function pushVisit(v,closed){const p=JSON.parse(JSON.stringify(v)); if(closed) p.closed=true; rpcQ('app_save_visit',{p_visit:p},'v:'+v.id);}
async function pump(){
  if(busy||!Q.length||!DEV) return; busy=true; net();
  while(Q.length){const q=Q[0];
    try{const f=await call(q.fn,{p_device:DEV.device,p_secret:DEV.secret,...q.args}); Q.shift(); store.set('tk_q',Q); lastErr=false; if(!Q.length) applyFloor(f);}
    catch(e){
      if(e.status>=400&&e.status<500){console.error(q.fn,e.body); Q.shift(); store.set('tk_q',Q); if(String(e.body).includes('device_not_registered')){busy=false; return reenroll();}}
      else{lastErr=true; net(); await sleep(4000);}
    }
  }
  busy=false; net();
}
function applyFloor(f){
  skew=f.now-Date.now();
  S.devRole=f.role; S.staff=f.staff; S.tables=f.tables; S.closed=f.closed; S.resv=f.resv; S.feed=f.feed; S.surveys=f.surveys; S.surveyAvg=f.surveyAvg; S.shop=f.shop; S.ready=true;
  if(S.role==='staff'&&!['home','resv','resvnew','help'].includes(S.screen)){const t=T(); if(!t||(!t.v&&!['recv','type'].includes(S.screen))){S.screen='home'; S.hist=[];}}
  const a=document.activeElement; if(a&&(a.tagName==='INPUT'||a.tagName==='SELECT')) return;
  render();
}
async function poll(){
  if(!DEV||busy||Q.length) return;
  try{const f=await call('app_floor',{p_device:DEV.device,p_secret:DEV.secret}); lastErr=false; if(!busy&&!Q.length) applyFloor(f);}
  catch(e){ if(String(e.body).includes('device_not_registered')) return reenroll(); lastErr=true; }
  net();
}
async function reenroll(){MD=null; MV++; DEV=null; store.del('tk_dev'); Q=[]; store.set('tk_q',Q); init(); LG.v++; render();}
/* ---------- 入口（ログイン／見本店） ---------- */
const START=['login','setpw','startdemo'];
const LG={mode:'login',err:'',id:'',busy:false,v:1};
const LERR={login_failed:'IDまたはパスワードが違います。',locked:'5回続けて間違えたため、5分間はログインできません。',too_short:'パスワードは8文字以上にしてください。',already_set:'このIDのパスワードはすでに決まっています。ログインしてください。'};
const label=()=>/iPad|Macintosh.*Mobile/.test(navigator.userAgent)?'iPad':/Mobi|Android|iPhone/.test(navigator.userAgent)?'スマホ':'パソコン';
function renderStart(){
  const app=document.getElementById('app'); document.getElementById('tb-t').textContent='店舗管理システム';
  ['tb-l','tb-r','band','act','who','bar-btns'].forEach(id=>{document.getElementById(id).innerHTML='';}); net();
  if(app.dataset.v===String(LG.v)) return; app.dataset.v=String(LG.v);
  const setup=LG.mode==='setup';
  app.innerHTML=`<section class="box" style="max-width:520px;width:100%;margin:0 auto"><h2>${setup?'最初のパスワードを決めます':'ログイン'}</h2>
    ${setup?`<p class="sub">ID「${esc(LG.id)}」は、まだパスワードが決まっていません。8文字以上で決めてください。決めたパスワードは、この画面にも記録にも残りません。</p>
      <label for="lg-new">新しいパスワード<input type="password" id="lg-new" autocomplete="new-password"></label>
      <label for="lg-new2">もう一度入力<input type="password" id="lg-new2" autocomplete="new-password"></label>`
     :`<label for="lg-id">ID<input type="text" id="lg-id" autocomplete="username" autocapitalize="none" spellcheck="false" value="${esc(LG.id)}"></label>
      <label for="lg-pw">パスワード<input type="password" id="lg-pw" autocomplete="current-password"></label>`}
    ${LG.err?`<p class="err" id="lg-err">${esc(LG.err)}</p>`:''}
    <div class="row"><button class="btn" id="lg-go" data-a="${setup?'setpw':'login'}" ${LG.busy?'disabled':''}>${setup?'このパスワードに決める':'ログイン'}${CHEV}</button></div></section>
  <section class="box" style="max-width:520px;width:100%;margin:0 auto"><h2>見本で試す</h2>
    <p class="sub">ログインなしで、見本データを使って操作を試せます。本物のお客様・スタッフのデータは入っていません。</p>
    <div class="row"><button class="btn line" id="start-demo" data-a="startdemo" ${LG.busy?'disabled':''}>見本店で試す</button><a class="btn line" id="start-kanri" href="kanri.html" style="text-decoration:none">管理画面のデモを見る</a></div></section>`;
}
function lgSet(o){Object.assign(LG,o); LG.v++; render();}
async function entered(d){DEV={device:d.device,secret:d.secret,role:d.role}; store.set('tk_dev',DEV); LG.mode='login'; LG.err=''; LG.busy=false; LG.v++;
  if(d.role==='hq'){location.href='kanri.html';return;} init(); render(); await poll(); pump();}
async function doLogin(){
  const id=(document.getElementById('lg-id').value||'').trim(), pw=document.getElementById('lg-pw').value||'';
  if(!id){return lgSet({err:'IDを入力してください。'});}
  lgSet({busy:true,err:'',id});
  try{const r=await call('app_login',{p_id:id,p_password:pw,p_label:label()});
    if(r.need_setup) return lgSet({mode:'setup',busy:false,err:''});
    if(r.error) return lgSet({busy:false,err:LERR[r.error]||'ログインできませんでした。'});
    await entered(r);
  }catch(e){lgSet({busy:false,err:'通信できませんでした。もう一度お試しください。'});}
}
async function doSetPw(){
  const a=document.getElementById('lg-new').value||'', b=document.getElementById('lg-new2').value||'';
  if(a.length<8) return lgSet({err:LERR.too_short});
  if(a!==b) return lgSet({err:'2つの入力が同じではありません。'});
  lgSet({busy:true,err:''});
  try{const r=await call('app_set_password',{p_id:LG.id,p_new:a});
    if(r.error) return lgSet({busy:false,mode:r.error==='already_set'?'login':'setup',err:LERR[r.error]||'設定できませんでした。'});
    const l=await call('app_login',{p_id:LG.id,p_password:a,p_label:label()});
    if(l.error||l.need_setup) return lgSet({busy:false,mode:'login',err:'パスワードを決めました。ログインしてください。'});
    await entered(l);
  }catch(e){lgSet({busy:false,err:'通信できませんでした。もう一度お試しください。'});}
}
async function enrollDemo(){
  lgSet({busy:true,err:''});
  try{const d=await call('app_enroll_demo',{p_label:label()}); await entered({...d,role:d.role||'demo'});}
  catch(e){lgSet({busy:false,err:'通信できませんでした。もう一度お試しください。'});}
}
async function boot(){
  DEV=DEV||store.get('tk_dev',null); if(!Q.length) Q=store.get('tk_q',[]);
  if(DEV&&DEV.role==='hq'){location.href='kanri.html';return;}
  render(); if(!DEV) return;
  await poll(); pump();
}
init(); boot(); setInterval(poll,5000);
</script>
</body>
